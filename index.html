<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <div class="themes" role="group" aria-label="Color theme">
      <button class="swatch" data-theme="neon" aria-label="Neon theme" aria-pressed="true"></button>
      <button class="swatch" data-theme="matrix" aria-label="Matrix theme" aria-pressed="false"></button>
      <button class="swatch" data-theme="amber" aria-label="Amber theme" aria-pressed="false"></button>
    </div>

    <div class="display">
      <div class="previous" id="previous"></div>
      <div class="current" id="current">0</div>
    </div>

    <div class="keys">
      <button data-action="clear" class="span-2">AC</button>
      <button data-action="delete">DEL</button>
      <button data-operator="÷" class="op">÷</button>

      <button data-number="7">7</button>
      <button data-number="8">8</button>
      <button data-number="9">9</button>
      <button data-operator="×" class="op">×</button>

      <button data-number="4">4</button>
      <button data-number="5">5</button>
      <button data-number="6">6</button>
      <button data-operator="−" class="op">−</button>

      <button data-number="1">1</button>
      <button data-number="2">2</button>
      <button data-number="3">3</button>
      <button data-operator="+" class="op">+</button>

      <button data-number="0" class="span-2">0</button>
      <button data-number=".">.</button>
      <button data-action="equals" class="equals">=</button>
    </div>

    <section class="history" aria-label="Calculation history">
      <div class="history-head">
        <h2>History</h2>
        <button id="clear-history" class="link-btn">Clear</button>
      </div>
      <ul id="history-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
